{% extends "base.html" %}

{% block content %}

<div class="single-post">

    <h1>{{ post["title"] }}</h1>

    <p class="author">
        By {{ post["username"] }}
    </p>

    <div class="post-content">
        {{ post["content"] }}
    </div>

    <a class="button" href="{{ url_for('index') }}">
        Back to Home
    </a>

</div>

{% endblock %}
